name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: lint man page
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc
          mandoc -T lint -Wall contrib/man/wisp.1
      - run: cargo fmt --all -- --check
      - name: coderabbit-style checks (docs + pub rustdoc on diff)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}"
            ./contrib/coderabbit-check.sh --base "${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --depth=1 || true
            ./contrib/coderabbit-check.sh --base origin/main
          fi
      - run: cargo test --workspace --no-run
      - run: cargo clippy --all-targets -- -D warnings -A clippy::type_complexity -A clippy::too_many_arguments -A clippy::manual_div_ceil -A clippy::collapsible_match -A clippy::redundant_closure -A clippy::unnecessary_get_then_check -A clippy::unnecessary_unwrap
      - run: cargo test --workspace
        env:
          FASTEMBED_CACHE_DIR: ${{ runner.temp }}/fastembed-cache
      - run: cargo test -p wisp-invariants --no-default-features
      - run: cargo build --release -p wisp-cli
      - run: cargo build --release -p wisp-cli --no-default-features

  stress:
    name: stress (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: exit3 adversarial (heavy)
        run: cargo test -p wisp-invariants battery_exit3_adversarial_heavy --release -- --ignored --nocapture
        env:
          WISP_EXIT3_BATTERY: "1"
          WISP_EXIT3_BATTERY_WRITERS: "16"
      - name: disjoint writers stress
        run: cargo test -p wisp-invariants stress_many_disjoint_writers --release -- --ignored --nocapture
        env:
          WISP_STRESS: "1"
          WISP_STRESS_WRITERS: "32"
