# Copy of .github/workflows/ci.yml for vendoring into forks. Canonical: .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings -A clippy::type_complexity -A clippy::too_many_arguments -A clippy::manual_div_ceil -A clippy::collapsible_match -A clippy::redundant_closure -A clippy::unnecessary_get_then_check -A clippy::unnecessary_unwrap
      - run: cargo test --workspace
      - run: cargo test -p wisp-invariants
      - run: cargo build --release -p wisp-cli
