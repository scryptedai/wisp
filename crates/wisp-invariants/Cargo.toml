[package]
name = "wisp-invariants"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Corpus-driven invariant and integration tests for wisp (§17)"
publish = false

[features]
default = ["semantic"]
semantic = ["wisp-engine/semantic"]

[dependencies]
wisp-corpus = { workspace = true }
wisp-crypto = { workspace = true }
wisp-engine = { workspace = true }
wisp-html = { workspace = true }
wisp-model = { workspace = true }
wisp-parse = { workspace = true }
wisp-match = { workspace = true }
wisp-profile = { workspace = true }
wisp-store = { workspace = true }
wisp-sync = { workspace = true }
wisp-merge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }

[lib]
path = "src/lib.rs"
